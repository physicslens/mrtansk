<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2-List To-Do (Today / Tomorrow)</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 16px; max-width: 760px; }
    h2 { margin: 0 0 12px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab {
      padding: 10px 12px; border: 1px solid #ccc; border-radius: 14px;
      cursor: pointer; background: #fff; user-select: none;
    }
    .tab.active { border-color: #111; }

    .row { display: flex; gap: 8px; align-items: center; }
    input[type="text"] {
      flex: 1; padding: 10px 12px; border-radius: 14px; border: 1px solid #ccc;
      outline: none;
    }
    button {
      padding: 10px 12px; border-radius: 14px; border: 1px solid #ccc;
      background: #fff; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }

    ul { list-style: none; padding: 0; margin: 12px 0 0; }
    li { border: 1px solid #eee; border-radius: 16px; padding: 10px; margin-bottom: 10px; }
    .task { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .task-text { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }

    .muted { color: #666; font-size: 12px; margin-top: 8px; min-height: 16px; }
    .danger { border-color: #f2b8b5; }

    .footer-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { font-size: 12px; color: #555; border: 1px solid #eee; padding: 6px 10px; border-radius: 999px; }
  </style>
</head>
<body>
  <h2>To-Do</h2>

  <div class="tabs">
    <div class="tab active" id="tab-today">Do-Today</div>
    <div class="tab" id="tab-tomorrow">Do-Tomorrow</div>
  </div>

  <div class="row">
    <input id="newTask" type="text" placeholder="Add a task…" autocomplete="off" />
    <button id="addBtn">Add</button>
  </div>

  <div class="muted" id="status"></div>

  <ul id="list"></ul>

  <div class="footer-actions">
    <span class="pill" id="countPill">0 task(s)</span>
    <button id="reloadBtn" title="Reload from Sheet">Reload</button>
  </div>

<script>
  // =========================================================
  // CONFIG: Paste your Apps Script Web App URL here
  // Example:
  // const API_URL = "https://script.google.com/macros/s/XXXXX/exec";
  // =========================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbx7hKwNk9hgd7XmrWAe2ry4G1ynETMFmArAY-MOCbqtFi38qi9sL3WDh3uL5cOLP3ZZ/exec";

  let currentList = "today";   // "today" | "tomorrow"
  let items = [];
  let busy = false;

  const $ = (sel) => document.querySelector(sel);
  const statusEl = $("#status");
  const listEl = $("#list");
  const addBtn = $("#addBtn");
  const reloadBtn = $("#reloadBtn");
  const countPill = $("#countPill");

  function setStatus(msg) { statusEl.textContent = msg || ""; }

  function setBusy(v) {
    busy = v;
    addBtn.disabled = v;
    reloadBtn.disabled = v;
    $("#newTask").disabled = v;
    // Disable action buttons in list
    document.querySelectorAll("button[data-action]").forEach(b => b.disabled = v);
  }

  // JSONP call: bypasses CORS on GitHub Pages
  function apiCall(params) {
    return new Promise((resolve, reject) => {
      if (!API_URL || API_URL.includes("PASTE_YOUR_WEB_APP_URL_HERE")) {
        reject(new Error("API_URL not set"));
        return;
      }

      const cb = "jsonp_cb_" + Math.random().toString(36).slice(2);
      window[cb] = (data) => { cleanup(); resolve(data); };

      const url = new URL(API_URL);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      url.searchParams.set("callback", cb);

      const script = document.createElement("script");
      script.src = url.toString();
      script.onerror = () => { cleanup(); reject(new Error("JSONP load failed")); };

      function cleanup() {
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        script.remove();
      }

      document.body.appendChild(script);
    });
  }

  function render() {
    $("#tab-today").classList.toggle("active", currentList === "today");
    $("#tab-tomorrow").classList.toggle("active", currentList === "tomorrow");

    listEl.innerHTML = "";
    const filtered = items.filter(x => (x.list || "").toLowerCase() === currentList);

    countPill.textContent = `${filtered.length} task(s)`;

    if (filtered.length === 0) {
      const empty = document.createElement("li");
      empty.textContent = "No tasks here yet.";
      listEl.appendChild(empty);
      return;
    }

    for (const it of filtered) {
      const li = document.createElement("li");

      const wrap = document.createElement("div");
      wrap.className = "task";

      const text = document.createElement("div");
      text.className = "task-text";
      text.textContent = it.text;

      const actions = document.createElement("div");
      actions.className = "row";

      const moveBtn = document.createElement("button");
      moveBtn.textContent = currentList === "today" ? "→ Tomorrow" : "← Today";
      moveBtn.dataset.action = "move";
      moveBtn.onclick = async () => {
        await moveTask(it.id, currentList === "today" ? "tomorrow" : "today");
      };

      const editBtn = document.createElement("button");
      editBtn.textContent = "Edit";
      editBtn.dataset.action = "edit";
      editBtn.onclick = async () => {
        const next = prompt("Edit task:", it.text);
        if (next === null) return;
        const t = next.trim();
        if (!t) return;
        await updateTask(it.id, t);
      };

      const delBtn = document.createElement("button");
      delBtn.textContent = "Delete";
      delBtn.className = "danger";
      delBtn.dataset.action = "delete";
      delBtn.onclick = async () => {
        if (!confirm("Delete this task?")) return;
        await deleteTask(it.id);
      };

      actions.appendChild(moveBtn);
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      wrap.appendChild(text);
      wrap.appendChild(actions);
      li.appendChild(wrap);
      listEl.appendChild(li);
    }

    // If we’re busy, keep buttons disabled
    if (busy) setBusy(true);
  }

  async function refresh() {
    try {
      setBusy(true);
      setStatus("Loading…");
      const out = await apiCall({ action: "list" });
      if (!out.ok) throw new Error(out.error || "Unknown error");
      items = out.items || [];
      setStatus(`Loaded ${items.length} total task(s) from Sheet.`);
      render();
    } catch (err) {
      setStatus("Error: " + err.message);
    } finally {
      setBusy(false);
    }
  }

  async function addTask() {
    const input = $("#newTask");
    const text = input.value.trim();
    if (!text) return;

    try {
      setBusy(true);
      setStatus("Adding…");
      input.value = "";
      const out = await apiCall({ action: "add", text, list: currentList });
      if (!out.ok) throw new Error(out.error || "Add failed");
      await refresh();
    } catch (err) {
      setStatus("Error: " + err.message);
    } finally {
      setBusy(false);
    }
  }

  async function updateTask(id, text) {
    try {
      setBusy(true);
      setStatus("Saving…");
      const out = await apiCall({ action: "update", id, text });
      if (!out.ok) throw new Error(out.error || "Update failed");
      await refresh();
    } catch (err) {
      setStatus("Error: " + err.message);
    } finally {
      setBusy(false);
    }
  }

  async function moveTask(id, to) {
    try {
      setBusy(true);
      setStatus("Moving…");
      const out = await apiCall({ action: "move", id, to });
      if (!out.ok) throw new Error(out.error || "Move failed");
      await refresh();
    } catch (err) {
      setStatus("Error: " + err.message);
    } finally {
      setBusy(false);
    }
  }

  async function deleteTask(id) {
    try {
      setBusy(true);
      setStatus("Deleting…");
      const out = await apiCall({ action: "delete", id });
      if (!out.ok) throw new Error(out.error || "Delete failed");
      await refresh();
    } catch (err) {
      setStatus("Error: " + err.message);
    } finally {
      setBusy(false);
    }
  }

  // UI events
  $("#addBtn").addEventListener("click", addTask);
  $("#newTask").addEventListener("keydown", (e) => {
    if (e.key === "Enter") addTask();
  });

  $("#tab-today").addEventListener("click", () => {
    currentList = "today";
    render();
  });

  $("#tab-tomorrow").addEventListener("click", () => {
    currentList = "tomorrow";
    render();
  });

  $("#reloadBtn").addEventListener("click", refresh);

  // Start
  refresh();
</script>
</body>
</html>
