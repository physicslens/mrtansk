<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2-List To-Do (Today / Tomorrow)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23fff'/><text x='50%' y='56%' font-size='42' text-anchor='middle' fill='%23000'>✓</text></svg>">
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 16px; max-width: 760px; background: #f9f9f7; }
    h2 { margin: 0 0 12px; display: none; }

    .tabs { display: none; }
    .tab {
      padding: 10px 12px; border: 1px solid #ccc; border-radius: 14px;
      cursor: pointer; background: #fff; user-select: none;
    }
    .tab.active { border-color: #111; }

    .row { display: flex; gap: 8px; align-items: center; }
    .add-row { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    input[type="text"] {
      flex: 1; padding: 10px 12px; border-radius: 14px; border: 1px solid #ccc;
      outline: none;
    }
    .add-row input[type="text"] { border: none; border-radius: 0; padding: 8px 0; background: transparent; font-family: "Noteworthy", "Marker Felt", system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    .add-row input::placeholder { color: #aaa; }
    button {
      padding: 10px 12px; border-radius: 14px; border: 1px solid #ccc;
      background: #fff; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }

    ul { list-style: none; padding: 0; margin: 12px 0 0; }
    li { border: 1px solid #eee; border-radius: 16px; padding: 10px; margin-bottom: 10px; }
    .task { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .task-text { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
    .task-text { cursor: pointer; }
    .task.done .task-text { text-decoration: line-through; color: #999; }
    .task-text a { color: #06c; text-decoration: underline; }

    .muted { color: #666; font-size: 12px; margin-top: 8px; min-height: 16px; }
    .danger { border-color: #f2b8b5; }

    .footer-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { font-size: 12px; color: #555; border: 1px solid #eee; padding: 6px 10px; border-radius: 999px; }
    #datePill { display: none; }

    .header { margin-bottom: 12px; }
    .title-row { display: flex; align-items: center; justify-content: space-between; }
    .title-row h1 { display: none; }
    .title-toggle { display: flex; gap: 12px; align-items: baseline; }
    .title-link { font-size: 28px; letter-spacing: .5px; background: transparent; border: 0; padding: 0; cursor: pointer; color: #999; }
    .title-link.active { color: #111; font-weight: 600; }
    .date { color: #666; font-size: 14px; }
    .edit-btn { font-size: 12px; padding: 6px 10px; border-radius: 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
    .edit-btn.active { border-color: #111; }
    .flourish { text-align: center; color: #999; margin: 10px 0; }
    li { border: none; border-bottom: 1px solid #eee; border-radius: 0; }
    .task-text { font-family: "Noteworthy", "Marker Felt", system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    .arrow-btn { padding: 6px 10px; }
    .arrow-btn[data-dir="right"] { }
    .arrow-btn[data-dir="left"] { }
    .day-toggle { display: flex; gap: 8px; align-items: center; }
    .day-link { font-size: 14px; padding: 0; border: 0; background: transparent; cursor: pointer; color: #999; }
    .day-link.active { color: #111; font-weight: 600; }
  </style>
</head>
<body>
  <h2>To-Do</h2>

  <div class="header">
    <div class="title-row">
      <div class="title-toggle">
        <button id="toggleToday" class="title-link">TODAY</button>
        <button id="toggleTomorrow" class="title-link">TOMORROW</button>
      </div>
      <button id="editToggle" class="edit-btn">edit</button>
    </div>
    <div id="headerDate" class="date"></div>
    <div class="flourish">⁓</div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-today">Do-Today</div>
    <div class="tab" id="tab-tomorrow">Do-Tomorrow</div>
  </div>

  <div class="add-row">
    <input id="newTask" type="text" placeholder="+ add a new task" autocomplete="off" autofocus />
  </div>

  <div class="muted" id="status"></div>

  <ul id="list"></ul>

  <div class="footer-actions">
    <span class="pill" id="datePill"></span>
    <span class="pill" id="loadedPill"></span>
  </div>

<script>
  // =========================================================
  // CONFIG: Paste your Apps Script Web App URL here
  // Example:
  // const API_URL = "https://script.google.com/macros/s/XXXXX/exec";
  // =========================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbx7hKwNk9hgd7XmrWAe2ry4G1ynETMFmArAY-MOCbqtFi38qi9sL3WDh3uL5cOLP3ZZ/exec";

  let currentList = "today";   // "today" | "tomorrow"
  let items = [];
  let busy = false;

  const $ = (sel) => document.querySelector(sel);
  const statusEl = $("#status");
  const listEl = $("#list");
  const datePill = $("#datePill");
  const loadedPill = $("#loadedPill");
  const headerDate = $("#headerDate");
  const editToggle = $("#editToggle");
  const toggleToday = $("#toggleToday");
  const toggleTomorrow = $("#toggleTomorrow");
  let editMode = false;
  let dayChanged = false;

  function setStatus(msg) { statusEl.textContent = msg || ""; }

  function setLoadedInfo(msg) { if (loadedPill) loadedPill.textContent = msg || ""; }

  function setBusy(v) {
    busy = v;
    $("#newTask").disabled = v;
    // Disable action buttons in list
    document.querySelectorAll("button[data-action]").forEach(b => b.disabled = v);
  }

  // JSONP call: bypasses CORS on GitHub Pages
  function apiCall(params) {
    return new Promise((resolve, reject) => {
      if (!API_URL || API_URL.includes("PASTE_YOUR_WEB_APP_URL_HERE")) {
        reject(new Error("API_URL not set"));
        return;
      }

      const cb = "jsonp_cb_" + Math.random().toString(36).slice(2);
      window[cb] = (data) => { cleanup(); resolve(data); };

      const url = new URL(API_URL);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      url.searchParams.set("callback", cb);

      const script = document.createElement("script");
      script.src = url.toString();
      script.onerror = () => { cleanup(); reject(new Error("JSONP load failed")); };

      function cleanup() {
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        script.remove();
      }

      document.body.appendChild(script);
    });
  }

  function render() {
    $("#tab-today").classList.toggle("active", currentList === "today");
    $("#tab-tomorrow").classList.toggle("active", currentList === "tomorrow");
    updateHeader();

    listEl.innerHTML = "";
    const tkey = getDateKey();
    const filtered = items
      .filter(x => (x.list || "").toLowerCase() === currentList);


    if (filtered.length === 0) {
      const empty = document.createElement("li");
      empty.textContent = "No tasks here yet.";
      listEl.appendChild(empty);
      return;
    }

    for (const it of filtered) {
      const li = document.createElement("li");

      const wrap = document.createElement("div");
      wrap.className = "task";

      const text = document.createElement("div");
      text.className = "task-text";
      text.appendChild(linkifyText(it.text));
      text.addEventListener("click", async (e) => {
        if (e.target.closest("a")) return;
        const isDone = it.doneOn === tkey;
        try {
          setBusy(true);
          setStatus(isDone ? "Unmarking…" : "Marking done…");
          if (isDone) {
            await unstrikeTask(it.id);
          } else {
            await strikeTask(it.id);
          }
          await refresh();
        } catch (err) {
          setStatus("Error: " + err.message);
        } finally {
          setBusy(false);
        }
      });

      const actions = document.createElement("div");
      actions.className = "row";

      const moveBtn = document.createElement("button");
      moveBtn.className = "arrow-btn";
      const dir = currentList === "today" ? "right" : "left";
      moveBtn.dataset.dir = dir;
      moveBtn.textContent = dir === "right" ? "→" : "←";
      moveBtn.dataset.action = "move";
      moveBtn.onclick = async () => {
        await moveTask(it.id, currentList === "today" ? "tomorrow" : "today");
      };

      actions.appendChild(moveBtn);

      if (editMode) {
        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.dataset.action = "edit";
        editBtn.onclick = async () => {
          const next = prompt("Edit task:", it.text);
          if (next === null) return;
          const t = next.trim();
          if (!t) return;
          await updateTask(it.id, t);
        };

        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete";
        delBtn.className = "danger";
        delBtn.dataset.action = "delete";
        delBtn.onclick = async () => {
          if (!confirm("Delete this task?")) return;
          await deleteTask(it.id);
        };

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
      }

      wrap.appendChild(text);
      wrap.appendChild(actions);
      wrap.classList.toggle("done", it.doneOn === tkey);
      li.appendChild(wrap);
      listEl.appendChild(li);
    }

    // If we’re busy, keep buttons disabled
    if (busy) setBusy(true);
  }

  async function refresh() {
    try {
      setBusy(true);
      setStatus("Loading…");
      const out = await apiCall({ action: "list" });
      if (!out.ok) throw new Error(out.error || "Unknown error");
      items = out.items || [];
      await maybeClearDoneOn();
      setLoadedInfo(`Loaded ${items.length} total task(s) from Sheet.`);
      setStatus("");
      render();
    } catch (err) {
      setStatus("Error: " + err.message);
    } finally {
      setBusy(false);
    }
  }

  async function addTask() {
    const input = $("#newTask");
    const text = input.value.trim();
    if (!text) return;

    try {
      setBusy(true);
      setStatus("Adding…");
      input.value = "";
      input.focus();
      const out = await apiCall({ action: "add", text, list: currentList });
      if (!out.ok) throw new Error(out.error || "Add failed");
      await refresh();
    } catch (err) {
      setStatus("Error: " + err.message);
    } finally {
      setBusy(false);
    }
  }

  async function updateTask(id, text) {
    try {
      setBusy(true);
      setStatus("Saving…");
      const out = await apiCall({ action: "update", id, text });
      if (!out.ok) throw new Error(out.error || "Update failed");
      await refresh();
    } catch (err) {
      setStatus("Error: " + err.message);
    } finally {
      setBusy(false);
    }
  }

  async function moveTask(id, to) {
    try {
      setBusy(true);
      setStatus("Moving…");
      const out = await apiCall({ action: "move", id, to });
      if (!out.ok) throw new Error(out.error || "Move failed");
      await refresh();
    } catch (err) {
      setStatus("Error: " + err.message);
    } finally {
      setBusy(false);
    }
  }

  async function deleteTask(id) {
    try {
      setBusy(true);
      setStatus("Deleting…");
      const out = await apiCall({ action: "delete", id });
      if (!out.ok) throw new Error(out.error || "Delete failed");
      await refresh();
    } catch (err) {
      setStatus("Error: " + err.message);
    } finally {
      setBusy(false);
    }
  }

  async function strikeTask(id) {
    const d = getDateKey();
    const out = await apiCall({ action: "strike", id, doneOn: d });
    if (!out.ok) throw new Error(out.error || "Strike failed");
  }

  async function unstrikeTask(id) {
    const out = await apiCall({ action: "unstrike", id });
    if (!out.ok) throw new Error(out.error || "Unstrike failed");
  }

  function linkifyText(s) {
    const frag = document.createDocumentFragment();
    const re = /(https?:\/\/[^\s]+|www\.[^\s]+)/gi;
    let last = 0;
    const matches = s.matchAll(re);
    for (const m of matches) {
      const i = m.index || 0;
      if (i > last) frag.appendChild(document.createTextNode(s.slice(last, i)));
      let href = m[0];
      if (href.startsWith("www.")) href = "https://" + href;
      const a = document.createElement("a");
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = m[0];
      a.addEventListener("click", (e) => e.stopPropagation());
      frag.appendChild(a);
      last = i + m[0].length;
    }
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    return frag;
  }

  async function maybeClearDoneOn() {
    if (!dayChanged) return;
    const t = getDateKey();
    const ids = items.filter(x => x.doneOn && x.doneOn !== t).map(x => x.id);
    if (ids.length === 0) { dayChanged = false; return; }
    await Promise.all(ids.map(id => unstrikeTask(id)));
    dayChanged = false;
    const out = await apiCall({ action: "list" });
    if (out.ok) items = out.items || [];
  }

  function setToday() {
    const d = new Date();
    const s = d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    if (datePill) datePill.textContent = s;
  }

  function updateHeader() {
    const d = new Date();
    if (currentList === "tomorrow") d.setDate(d.getDate() + 1);
    headerDate.textContent = d.toLocaleDateString(undefined, { month: "long", day: "numeric" });
    toggleToday.classList.toggle("active", currentList === "today");
    toggleTomorrow.classList.toggle("active", currentList === "tomorrow");
  }

  function toggleEdit() {
    editMode = !editMode;
    editToggle.classList.toggle("active", editMode);
    editToggle.textContent = editMode ? "done" : "edit";
    render();
  }

  function getDateKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const da = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${da}`;
  }

  function switchList(to) {
    currentList = to === "tomorrow" ? "tomorrow" : "today";
    try {
      localStorage.setItem("lastList", currentList);
      localStorage.setItem("lastDate", getDateKey());
    } catch {}
    render();
  }

  function initDayState() {
    let startList = "today";
    try {
      const lastDate = localStorage.getItem("lastDate");
      const lastList = localStorage.getItem("lastList");
      const todayKey = getDateKey();
      dayChanged = lastDate !== todayKey;
      if (lastDate === todayKey && (lastList === "today" || lastList === "tomorrow")) {
        startList = lastList;
      }
      localStorage.setItem("lastDate", todayKey);
      localStorage.setItem("lastList", startList);
    } catch {}
    currentList = startList;
  }

  // UI events
  $("#newTask").addEventListener("keydown", (e) => {
    if (e.key === "Enter") addTask();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || busy) return;
    const input = $("#newTask");
    if (document.activeElement === input) return;
    if (!input.value.trim()) return;
    addTask();
  });

  $("#tab-today").addEventListener("click", () => { switchList("today"); });

  $("#tab-tomorrow").addEventListener("click", () => { switchList("tomorrow"); });

  toggleToday.addEventListener("click", () => { switchList("today"); });
  toggleTomorrow.addEventListener("click", () => { switchList("tomorrow"); });

  editToggle.addEventListener("click", toggleEdit);


  let touchStartX = 0;
  let touchStartY = 0;
  let touching = false;
  const SWIPE_THRESHOLD = 50;
  const MAX_VERTICAL_DRIFT = 40;

  document.body.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touching = true;
  }, { passive: true });

  document.body.addEventListener("touchend", (e) => {
    if (!touching) return;
    touching = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dy) > MAX_VERTICAL_DRIFT) return;
    if (Math.abs(dx) < SWIPE_THRESHOLD) return;
    if (dx < 0 && currentList === "today") { switchList("tomorrow"); }
    else if (dx > 0 && currentList === "tomorrow") { switchList("today"); }
  }, { passive: true });

  // Start
  initDayState();
  setToday();
  updateHeader();
  refresh();
</script>
</body>
</html>
